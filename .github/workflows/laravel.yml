name: Fullstack CI (Laravel & Inertia React)

on:
  push:
    branches: ["main", "Staging", "staging"]
  pull_request:
    branches: ["main", "Staging", "staging"]

jobs:
  fullstack-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      # --- BACKEND ENVIRONMENT SETUP ---
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, curl
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # --- FRONTEND ENVIRONMENT SETUP ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Environment File & Permissions
        run: |
          cp .env.example .env
          chmod -R 777 storage bootstrap/cache

      # --- INSTALL DEPENDENCIES ---
      - name: Install Backend Dependencies (Composer)
        run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Install Frontend Dependencies (NPM)
        run: npm ci

      # --- BUILD FRONTEND ASSETS ---
      - name: Build Frontend Assets (Vite & React)
        run: npm run build

      # --- DATABASE & APPLICATION TESTS ---
      - name: Generate App Key
        run: php artisan key:generate

      - name: Jalankan Migrasi Database
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing_db
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate --force

      - name: Jalankan Test Suite (Pest / PHPUnit)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing_db
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test
